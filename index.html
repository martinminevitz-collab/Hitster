<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=DM+Mono:wght@500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mesa de madera vista desde arriba, la tablet en el medio. Cada jugador tiene su línea en su borde, girada hacia él. En el centro, el mazo y la carta que suena, que gira hacia el jugador de turno junto con los botones. Look único: madera clara y cartas de papel. */
:root{
  --wood:#CC9356; --wood-2:#D8A466; --wood-3:#C2864A; --grain:rgba(110,62,22,.13); --knot:rgba(92,50,18,.55); --sun:rgba(255,236,196,.32);
  --ink:#2B1D10; --ink-soft:#6A5540; --paper:#FFFDF7; --cream:#F5ECD8; --line:#D9C9A8; --shadow:rgba(60,30,8,.32);
  --back:#1F4E56; --back-line:#7FA9AE;
  --red:#C2362B; --red-ink:#FFF7EC;
  --good:#2F8A4E; --bad:#C2362B;
  --d1960:#E7A0A8; --d1970:#EDB271; --d1980:#86C7C4; --d1990:#A9B2E3; --d2000:#9FD1A6; --d2010:#C9ADE3; --d2020:#F0A08F;
  --f-display:"Bitter",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  background-color:var(--wood);
  background-image:
    radial-gradient(ellipse 60% 45% at 6% 4%,var(--sun),transparent 70%),
    radial-gradient(ellipse 16px 9px at 21% 63%,var(--knot),transparent 72%),
    radial-gradient(ellipse 40px 18px at 21% 63%,rgba(110,62,22,.18),transparent 72%),
    radial-gradient(ellipse 12px 8px at 81% 28%,var(--knot),transparent 72%),
    radial-gradient(ellipse 30px 15px at 81% 28%,rgba(110,62,22,.16),transparent 72%),
    radial-gradient(ellipse 10px 7px at 66% 86%,var(--knot),transparent 72%),
    repeating-linear-gradient(180deg,transparent 0 255px,rgba(70,38,12,.28) 255px 257px,transparent 257px 258px),
    repeating-linear-gradient(178.6deg,transparent 0 17px,var(--grain) 17px 19px,transparent 19px 37px,rgba(110,62,22,.07) 37px 38px,transparent 38px 61px),
    repeating-linear-gradient(181.3deg,transparent 0 44px,rgba(255,230,180,.10) 44px 52px,transparent 52px 97px),
    linear-gradient(97deg,var(--wood),var(--wood-2) 38%,var(--wood-3) 66%,var(--wood-2));
  background-attachment:fixed}
#app{height:100%;overflow-y:auto;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.42}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.soft{color:var(--ink-soft)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.08}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-weight:600;min-height:40px;box-shadow:0 2px 4px var(--shadow)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{min-height:34px;padding:5px 11px;font-size:13px}
.btn .cost{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft)}
.btn.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- cartas ---------- */
.card{--w:var(--cw,80px);width:var(--w);height:calc(var(--w)*1.36);flex:none;border-radius:calc(var(--w)*.08);position:relative;box-shadow:0 2px 5px var(--shadow),0 0 0 .5px rgba(0,0,0,.08)}
.face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:var(--paper);padding:calc(var(--w)*.06);display:flex;flex-direction:column;gap:calc(var(--w)*.04)}
.front .band{background:var(--c);border-radius:calc(var(--w)*.04);display:grid;place-items:center;padding:calc(var(--w)*.08) 0}
.front .yr{font-family:var(--f-mono);font-weight:500;font-size:calc(var(--w)*.25);line-height:1;letter-spacing:-.03em;color:var(--ink)}
.front .txt{flex:1;background:var(--cream);border-radius:calc(var(--w)*.04);padding:calc(var(--w)*.06);display:flex;flex-direction:column;gap:calc(var(--w)*.03);min-height:0}
.front .ar{font-family:var(--f-display);font-weight:700;font-size:calc(var(--w)*.115);line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.front .ti{font-size:calc(var(--w)*.105);line-height:1.12;color:var(--ink-soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.backf{background:var(--motif),var(--back);border:calc(var(--w)*.05) solid var(--paper);display:grid;place-items:center}
/* temas de cada mazo: dorso propio y una franja de color al frente (Rock Nacional queda como estaba) */
:root{--motif:linear-gradient(transparent,transparent);--accent:transparent}
[data-th="rock-en-ingles"]{--back:#17171A;--back-line:#E0413A;--accent:#E0413A;--motif:repeating-radial-gradient(circle at 50% 58%,rgba(255,255,255,.09) 0 1px,transparent 1.5px 5px)}
[data-th="pop-internacional"]{--back:#7A2CB8;--back-line:#FFC2E8;--accent:#D63C9C;--motif:radial-gradient(circle at 24% 22%,rgba(255,255,255,.5) 0 2px,transparent 3px),radial-gradient(circle at 78% 72%,rgba(255,255,255,.4) 0 1.5px,transparent 2.5px),radial-gradient(circle at 68% 30%,rgba(255,255,255,.35) 0 1px,transparent 2px),linear-gradient(160deg,#E0479E,#6A2CC0)}
[data-th="pop-y-rock-latino"]{--back:#C8461B;--back-line:#FFD27A;--accent:#E0651F;--motif:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,210,122,.26) 0 9deg,transparent 9deg 18deg)}
[data-th="cumbia-y-cuarteto"]{--back:#0E7C70;--back-line:#FFE45C;--accent:#14A38F;--motif:repeating-linear-gradient(135deg,rgba(255,228,92,.3) 0 6px,transparent 6px 12px,rgba(255,92,140,.28) 12px 18px,transparent 18px 24px)}
[data-th="canciones-de-peliculas"]{--back:#15171F;--back-line:#E3B341;--accent:#E3B341;--motif:linear-gradient(90deg,transparent 0 14%,#15171F 14% 86%,transparent 86%),repeating-linear-gradient(180deg,rgba(227,179,65,.95) 0 5px,transparent 5px 11px)}
[data-th="todos"]{--back:#2B1D10;--back-line:#E2B27A;--motif:repeating-linear-gradient(45deg,rgba(226,178,122,.16) 0 6px,transparent 6px 12px)}
.front[data-th]{box-shadow:inset 0 calc(var(--w)*-.045) 0 var(--accent)}
.front[data-th] .txt{background:color-mix(in srgb,var(--accent) 16%,var(--cream))}
.backf::before{content:"";position:absolute;inset:calc(var(--w)*.06);border:1.5px solid var(--back-line);border-radius:calc(var(--w)*.04)}
.backf .q{font-family:var(--f-display);font-weight:800;font-size:calc(var(--w)*.42);color:var(--paper);line-height:1}
.backf .lb{position:absolute;top:calc(var(--w)*.14);left:0;right:0;text-align:center;font-family:var(--f-display);font-size:calc(var(--w)*.085);color:var(--back-line);letter-spacing:.08em;text-transform:uppercase}
.flipwrap{perspective:900px}
.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.7,.3,1);border-radius:inherit}
.flipper .front{transform:rotateY(180deg)}
.flipped .flipper{transform:rotateY(180deg)}
.noanim .flipper{transition:none}
.ring-ok{box-shadow:0 0 0 3px var(--good),0 3px 8px var(--shadow)}
.ring-ko{box-shadow:0 0 0 3px var(--bad),0 3px 8px var(--shadow)}
.tilt{transform:rotate(var(--r))}

/* ---------- líneas de cada jugador ---------- */
/* carta angosta: cuando la línea tiene muchas cartas, se ve el año grande en vertical (que es lo que importa para ubicar) */
.card.slim{width:var(--w);height:var(--h);border-radius:7px}
.slimf{position:absolute;inset:0;border-radius:inherit;background:var(--c);border:2px solid var(--paper);border-bottom-color:var(--accent,var(--paper));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.slimf .yr{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-weight:500;font-size:var(--fs);line-height:1;letter-spacing:-.03em;color:var(--ink)}
.slimf .ar{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-display);font-weight:700;font-size:9px;line-height:1;color:var(--ink);opacity:.75;max-height:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row.tight{gap:3px}
.card.bar{width:var(--w);height:var(--h);border-radius:6px}
.barf{position:absolute;inset:0;border-radius:inherit;background:var(--c);border:2px solid var(--paper);border-left:4px solid var(--accent,var(--paper));display:flex;align-items:center;gap:7px;padding:0 6px;overflow:hidden}
.barf .yr{font-family:var(--f-mono);font-weight:500;font-size:var(--fs);line-height:1;letter-spacing:-.03em;color:var(--ink);flex:none}
.barf .ar{font-family:var(--f-display);font-weight:700;font-size:10px;line-height:1.1;color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rail.vert .row{flex-direction:column;flex:1 1 auto;min-height:0;width:100%;max-width:none;overflow-x:hidden;overflow-y:auto;align-items:stretch}
.rail.vert .row>.card{align-self:center}
.rail.vert .slot{flex-direction:row}
.rail.vert button.slot{min-width:0;min-height:14px;width:100%}
.rail.vert .slot.should{writing-mode:horizontal-tb;transform:none;padding:1px 4px}
.rail.vert .tag{flex-wrap:wrap;justify-content:center;max-width:100%;border-radius:12px}
.turn-in{animation:turnpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes turnpop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
.row.tight button.slot{min-width:14px;font-size:13px}
.stage.wide{flex-direction:row;flex-wrap:wrap;align-content:center;gap:12px 18px}
.quit.vista{right:64px}
.rail{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:4px 6px}
.rail.on::before{content:"";position:absolute;inset:-4px 0 0;background:radial-gradient(ellipse 60% 75% at 50% 70%,rgba(255,244,214,.55),transparent 75%);pointer-events:none}
.row{position:relative;display:flex;align-items:stretch;gap:5px;max-width:100%;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.row>*{flex:none}
.tag{position:relative;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:2px 10px 2px 4px;font-size:13px;box-shadow:0 1px 3px var(--shadow)}
.tag .dot{width:16px;height:16px;border-radius:50%;background:var(--pc)}
.tag b{font-weight:700}
.rail.on .tag{box-shadow:0 0 0 2px var(--pc),0 1px 3px var(--shadow)}
.tokens{display:flex;gap:3px}
.tokens i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-soft)}
.tokens i.f{background:var(--ink);border-color:var(--ink)}
.slot{min-width:20px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed transparent}
button.slot{border-color:rgba(255,250,235,.75);color:var(--paper);font-size:16px;font-weight:700;background:rgba(255,250,235,.12)}
button.slot:not(:disabled):hover{background:rgba(255,250,235,.32)}
button.slot.hot{border-color:var(--pc);color:var(--pc);background:rgba(255,250,235,.55);min-width:28px}
.slot.should{border-color:var(--good);background:rgba(255,250,235,.7);color:var(--good);font-size:10px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 1px}
.chip{width:24px;height:24px;border-radius:50%;background:var(--pc);border:3px solid var(--paper);box-shadow:0 2px 4px var(--shadow);display:grid;place-items:center;color:var(--paper);font-weight:800;font-size:11px}
.chip.win{box-shadow:0 0 0 3px var(--good)} .chip.lose{opacity:.45}
.drop{animation:drop .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes drop{from{transform:translateY(-30px) scale(1.4);opacity:0}to{transform:none;opacity:1}}

/* ---------- centro (gira hacia el que juega) ---------- */
.stage{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot));transition:transform .7s cubic-bezier(.4,.1,.2,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.pair{display:flex;align-items:center;gap:18px}
.pile{position:relative;width:var(--cw);height:calc(var(--cw)*1.36)}
.pile .card{position:absolute;inset:0}
.pile .card:nth-child(1){transform:rotate(-7deg) translate(-3px,3px)}
.pile .card:nth-child(2){transform:rotate(4deg) translate(3px,1px)}
.pile-n{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink);font-weight:600}
.note{background:var(--paper);border-radius:14px;padding:10px 16px;box-shadow:0 3px 8px var(--shadow);display:grid;gap:6px;text-align:center;max-width:100%}
.note h2{font-size:clamp(17px,2.2vw,24px);font-weight:800}
.note h2 span{color:var(--pc)}
.note p{margin:0;color:var(--ink-soft);font-size:14px}
.playing{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.eq{display:inline-flex;gap:2px;height:12px;align-items:flex-end}
.eq i{width:3px;background:var(--red);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.wobble{animation:wobble 2.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-2px)}}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.hitster{width:60px;height:60px;border-radius:50%;background:var(--red);color:var(--red-ink);font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--red),0 5px 12px var(--shadow);transition:transform .15s;flex:none}
.hitster:not(:disabled):hover{transform:scale(1.06)}
.hitster:not(:disabled):active{transform:scale(.95)}
.result{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2.2vw,23px);line-height:1.15}
.result.ok{color:var(--good)} .result.ko{color:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.quit{position:absolute;top:2px;right:2px;font-size:12px;color:var(--ink);background:rgba(255,250,235,.6);border-radius:999px;padding:3px 10px;z-index:3}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(43,29,16,.35);display:grid;place-items:center;padding:20px}
.sheet{background:var(--paper);border-radius:18px;padding:20px;display:grid;gap:12px;width:min(420px,100%);box-shadow:0 20px 50px rgba(43,29,16,.35);transform:rotate(var(--rot,0deg))}
.sheet h3{font-size:24px;font-weight:800;color:var(--red)}
.sheet .who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sheet .who .btn{justify-content:space-between;border-color:var(--pc);border-radius:14px}
.sheet .who .btn b{color:var(--pc)}

/* setup y final */
.page{max-width:760px;margin:0 auto;padding-block:16px 40px;display:grid;gap:20px}
.panel{background:var(--paper);border-radius:18px;padding:18px;display:grid;gap:14px;box-shadow:0 6px 18px var(--shadow)}
.hero{display:grid;gap:10px}
.hero h1{font-size:clamp(38px,6.5vw,64px);font-weight:800;letter-spacing:-.01em}
.hero h1 span{color:var(--red)}
.hero p{margin:0;color:var(--ink-soft);max-width:58ch}
.fan{display:flex;padding:6px 0 4px 14px}
.fan .card{--w:58px;margin-left:-14px}
.panel h3{font-size:19px;font-weight:700}
.plist{display:grid;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .dot{width:18px;height:18px;border-radius:50%;background:var(--pc);border:2px solid var(--paper);box-shadow:0 1px 2px var(--shadow);flex:none}
.prow input{flex:1;min-width:0;background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;min-height:44px}
.opts{display:flex;flex-wrap:wrap;gap:20px}
.opt{display:grid;gap:6px}
.opt label{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:34px;text-align:center;font-size:20px}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-soft);max-width:65ch}
.rules b{color:var(--ink);font-weight:600}
.hint{font-size:13px;color:var(--ink-soft);border-left:3px solid var(--red);padding-left:10px;max-width:65ch;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.winpage{justify-items:center;text-align:center}
.winpage .panel{justify-items:center}
.winpage h1{font-size:clamp(40px,7vw,76px);font-weight:800}
.winpage h1 span{color:var(--pc)}
.wline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wline .card{--w:76px}
.standings{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stand{display:flex;gap:8px;align-items:center;background:var(--cream);border-radius:999px;padding:5px 14px}
.stand b{color:var(--pc)}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:reduce){
  .eq i,.wobble,.drop,.turn-in{animation:none}
  .eq i{height:9px}
  .flipper,.stage{transition:none}
}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="spotify.js"></script>
<script>
/* Los temas viven en songs.json (los arma tools/biblioteca.mjs). Cada partida usa un mazo, o todos mezclados. */
const TODOS="todos",MAZO_KEY="hitster-mazo";
let LIB={mazos:[],temas:[]},MAZOS=[],MAZO="rock-nacional",MAZO_NOMBRE="",SONGS=[];
function buildDeck(id){
  const deck=LIB.temas.filter(t=>(id===TODOS||t.mazo===id)&&!t.fuera&&t.spotify);
  const vistos=new Set(); // en "todos" un mismo tema puede estar en dos mazos
  return deck.filter(t=>{const k=t.spotify;if(vistos.has(k))return false;vistos.add(k);return true})
    .map((t,i)=>({id:i,key:t.id,t:t.titulo,a:t.artista,y:t.anio,spotify:t.spotify,dur:t.duracion_ms||null,pe:t.pelicula||null,mz:t.mazo}));
}
function useMazo(id){
  if(id!==TODOS&&!MAZOS.some(m=>m.id===id))id=(MAZOS[0]||{}).id||id;
  MAZO=id;SONGS=buildDeck(id);
  MAZO_NOMBRE=id===TODOS?"Todos los mazos":((MAZOS.find(m=>m.id===id)||{}).nombre||"");
}
async function loadSongs(){
  try{LIB=await (await fetch("songs.json",{cache:"no-cache"})).json()}catch(e){LIB={mazos:[],temas:[]};console.error(e)}
  MAZOS=(LIB.mazos||[]).map(m=>({...m,n:buildDeck(m.id).length})).filter(m=>m.n>0);
  let pref=null;try{pref=localStorage.getItem(MAZO_KEY)}catch(e){}
  useMazo(pref||MAZO);
}

const PCOLORS=["#B8362E","#2A5DA8","#2E7D4F","#D9A21E","#7A4FA6","#D46F2A","#1F8A8A","#C2507E"];
const MAX_TOKENS=5, KEY="hitster-rocknac-v4";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* asientos por borde [abajo, izquierda, arriba, derecha] según cantidad de jugadores */
const SEATS={2:[1,0,1,0],3:[1,1,0,1],4:[1,1,1,1],5:[2,1,1,1],6:[2,1,2,1],7:[2,2,2,1],8:[2,2,2,2]};

let state=null;
let setup={names:["Jugador 1","Jugador 2","Jugador 3","Jugador 4"],target:10,tokens:2,start:"begin",device:null};
let ui={modal:null,flyFrom:null,flipDone:false,dropPid:null,angle:null,screen:null,dev:{loading:false,list:[],error:null},audio:{st:"loading"}};

const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dec=y=>`var(--d${Math.min(2020,Math.max(1960,Math.floor(y/10)*10))})`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const song=id=>SONGS[id];
const P=id=>state.players.find(p=>p.id===id);
const cur=()=>state.players[state.current];
const jitter=id=>(((id*37)%7)-3)*.6+"deg";

function save(){try{state?localStorage.setItem(KEY,JSON.stringify(state)):localStorage.removeItem(KEY)}catch(e){}}
const deckSig=(list=SONGS)=>list.map(s=>s.key).join(",");
// una partida guardada solo sirve si su mazo no cambió (las cartas se guardan por posición)
function loadSaved(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");return s&&s.phase&&s.phase!=="win"&&s.sig===deckSig(buildDeck(s.mazo||"rock-nacional"))?s:null}catch(e){return null}}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
async function keepAwake(){try{await navigator.wakeLock?.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&state&&state.phase!=="win")keepAwake()});

/* ---------- lógica ---------- */
function insertSorted(tl,id){tl.push(id);tl.sort((a,b)=>song(a).y-song(b).y)}
function fits(tl,slot,y){const p=tl[slot-1],n=tl[slot];return (p===undefined||song(p).y<=y)&&(n===undefined||y<=song(n).y)}
function draw(){
  if(!state.deck.length&&state.discard.length){state.deck=shuffle(state.discard);state.discard=[];toast("Se volvieron a mezclar las cartas descartadas")}
  return state.deck.length?state.deck.pop():null;
}
function newGame(){
  const names=setup.names.map(n=>n.trim()).filter(Boolean);
  if(names.length<2){toast("Hacen falta al menos 2 jugadores");return}
  if(!SONGS.length){toast("No se pudieron cargar los temas. Revisá la conexión y recargá.");return}
  state={phase:"turn",mazo:MAZO,sig:deckSig(),target:setup.target,startMode:setup.start,device:setup.device,deck:shuffle(SONGS.map(s=>s.id)),discard:[],current:0,
    players:names.map((n,i)=>({id:i,name:n,color:PCOLORS[i%PCOLORS.length],timeline:[],tokens:setup.tokens}))};
  state.players.forEach(p=>p.timeline.push(draw()));
  state.current=Math.floor(Math.random()*state.players.length);
  ui.angle=null;keepAwake();startTurn();
}
function startTurn(){
  Object.assign(state,{phase:"turn",card:draw(),placement:null,challenges:[],pending:null,result:null,guess:null,guessMovie:null,snap:null});
  ui.flipDone=false;ui.audio={st:"loading"};
  if(state.card===null){state.phase="win";state.winner=null;stopMusic()}
  render();playCurrent();
}
/* ---------- música (Spotify Connect) ---------- */
let playSeq=0;
function playCurrent(){
  if(!state||state.phase!=="turn"||state.card===null)return;
  const seq=++playSeq,id=state.card;
  if(!state.device){ui.audio={st:"error",msg:"No hay un dispositivo elegido para la música."};updateAudio();return}
  ui.audio={st:"loading"};updateAudio();
  Spotify.play(song(id),state.device.id,state.startMode)
    .then(()=>{if(seq===playSeq){ui.audio={st:"playing"};updateAudio()}})
    .catch(e=>{if(seq===playSeq){ui.audio={st:"error",msg:Spotify.playError(e)};updateAudio()}});
}
function stopMusic(){playSeq++;if(state&&state.device)Spotify.pause(state.device.id)}
function audioHTML(){
  const a=ui.audio;
  if(a.st==="playing")return `<span class="playing"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Sonando</span>`;
  if(a.st==="error")return `<span style="font-size:13px;color:var(--bad);font-weight:600">${esc(a.msg)}</span><div><button class="btn small" data-act="replay">Reintentar</button></div>`;
  return `<span class="playing">Poniendo el tema…</span>`;
}
function updateAudio(){const el=document.getElementById("audio");if(el)el.innerHTML=audioHTML()}
function loadDevices(){
  ui.dev={loading:true,list:[],error:null};render();
  if(!Spotify.connected()){ui.dev.loading=false;render();return}
  Spotify.devices().then(list=>{ui.dev={loading:false,list,error:null}})
    .catch(e=>{ui.dev={loading:false,list:[],error:Spotify.playError(e)}})
    .finally(()=>{if(!state&&ui.screen==="devices")render()});
}
function anchorRect(){const el=document.querySelector('[data-anchor="placed"]')||document.querySelector('[data-anchor="mystery"]');return el?el.getBoundingClientRect():null}
function place(slot){
  if(state.phase!=="turn")return;
  if(state.pending!==null){
    if(slot===state.placement||state.challenges.some(c=>c.slot===slot))return;
    const p=P(state.pending);p.tokens--;state.challenges.push({pid:p.id,slot});ui.dropPid=p.id;state.pending=null;
  } else {
    if(state.challenges.length)return;
    ui.flyFrom=anchorRect();state.placement=slot;
  }
  render();
}
function reveal(){
  const a=cur(),y=song(state.card).y,tl=a.timeline.slice();
  state.snap=tl;
  let r;
  if(fits(tl,state.placement,y)){insertSorted(a.timeline,state.card);r={type:"active",pid:a.id}}
  else{
    const w=state.challenges.find(c=>fits(tl,c.slot,y));
    if(w){insertSorted(P(w.pid).timeline,state.card);r={type:"challenger",pid:w.pid}}
    else{state.discard.push(state.card);r={type:"none"}}
  }
  state.result=r;state.phase="reveal";ui.flipDone=false;ui.stealDone=r.type!=="challenger";render();
}
function nextTurn(){
  const a=cur();
  // tema y artista: +1 ficha; en temas de películas, decir la película: +1 más (máximo 5 en total)
  a.tokens=Math.min(MAX_TOKENS,a.tokens+(state.guess===true?1:0)+(state.guessMovie===true?1:0));
  const w=state.players.find(p=>p.timeline.length>=state.target);
  if(w){state.phase="win";state.winner=w.id;stopMusic();render();return}
  state.current=(state.current+1)%state.players.length;startTurn();
}
function skip(){
  const a=cur();if(a.tokens<1||state.placement!==null)return;
  a.tokens--;state.discard.push(state.card);state.card=draw();
  if(state.card===null){state.phase="win";state.winner=null;stopMusic()}
  toast(`${a.name} gastó 1 ficha y salteó el tema`);render();playCurrent();
}
function buy(){
  const a=cur();if(a.tokens<3||state.placement!==null)return;
  const c=draw();if(c===null){toast("No quedan cartas en el mazo");return}
  a.tokens-=3;insertSorted(a.timeline,c);
  toast(`${a.name} canjeó 3 fichas: suma “${song(c).t}” (${song(c).y})`);
  if(a.timeline.length>=state.target){state.phase="win";state.winner=a.id;stopMusic()}
  render();
}

/* ---------- geometría de la mesa ---------- */
/* Dos vistas:
   - "mesa": la tablet en el medio, cada línea en su borde mirando a su dueño. Las líneas del lado corto
     de la pantalla se estiran hasta las esquinas (que quedaban vacías) para que entren más cartas.
   - "pantalla": para compu o tele. Todo mira al frente; el que juega va abajo, grande, y los demás arriba. */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function layout(){
  const tw=$app.clientWidth,th=$app.clientHeight,n=state.players.length;
  return vista()==="pantalla"?layoutPantalla(tw,th,n):layoutMesa(tw,th,n);
}
function layoutMesa(tw,th,n){
  const T=Math.round(clamp(Math.min(tw,th)*.21,80,140));
  const C=SEATS[n]||SEATS[8],land=tw>=th,top0=40,m=8;
  const s=[];let a,b,L;
  [a,b]=land?[T,tw-T]:[m,tw-m];L=(b-a)/C[0];for(let i=0;i<C[0];i++)s.push({cx:b-L*(i+.5),cy:th-T/2,L,T,rot:0});
  [a,b]=land?[top0,th-m]:[T,th-T];L=(b-a)/C[1];for(let i=0;i<C[1];i++)s.push({cx:T/2,cy:b-L*(i+.5),L,T,rot:90});
  [a,b]=land?[T,tw-T]:[m,tw-130];L=(b-a)/C[2];for(let i=0;i<C[2];i++)s.push({cx:a+L*(i+.5),cy:T/2,L,T,rot:180});
  [a,b]=land?[top0,th-m]:[T,th-T];L=(b-a)/C[3];for(let i=0;i<C[3];i++)s.push({cx:tw-T/2,cy:a+L*(i+.5),L,T,rot:-90});
  // "todas hacia abajo": nada gira; arriba la línea queda derecha y las de los costados van de arriba hacia abajo
  if(orient()==="abajo")for(const x of s){if(Math.abs(x.rot)===90)x.vert=true;x.rot=0}
  const rot=s[state.current].rot,side=Math.abs(rot)%180===90,w0=tw-2*T-20,h0=th-2*T-20;
  return{tw,th,seats:s,stage:{cx:tw/2,cy:th/2,w:side?h0:w0,h:side?w0:h0,rot,wide:false}};
}
function layoutPantalla(tw,th,n){
  const top0=40,Tb=Math.round(clamp(th*.28,110,200));
  const others=n-1,cols=Math.max(1,Math.min(others,Math.floor((tw-16)/300)||1)),rows=Math.ceil(others/cols);
  const ro=Math.round(Math.min(120,clamp(th*.32,90,rows*120)/rows)),cwid=(tw-16)/cols;
  const s=new Array(n);
  for(let k=1;k<=others;k++){
    const idx=(state.current+k)%n,col=(k-1)%cols,row=Math.floor((k-1)/cols);
    s[idx]={cx:8+cwid*(col+.5),cy:top0+ro*(row+.5),L:cwid-8,T:ro,rot:0};
  }
  s[state.current]={cx:tw/2,cy:th-Tb/2-4,L:tw-24,T:Tb,rot:0};
  const top=top0+ro*rows+8,bottom=th-Tb-8;
  return{tw,th,seats:s,stage:{cx:tw/2,cy:(top+bottom)/2,w:tw-40,h:Math.max(120,bottom-top),rot:0,wide:true}};
}

/* ---------- piezas ---------- */
function front(id){const s=song(id);return `<div class="face front" data-th="${esc(s.mz||"")}" style="--c:${dec(s.y)}"><span class="band"><span class="yr">${s.y}</span></span><span class="txt"><span class="ar">${esc(s.a)}</span><span class="ti">${esc(s.t)}</span></span></div>`}
const TH_LABEL={"rock-nacional":"Hitster","rock-en-ingles":"Rock","pop-internacional":"Pop","pop-y-rock-latino":"Latino","cumbia-y-cuarteto":"Cumbia & regg.","canciones-de-peliculas":"Cine",todos:"Hitster"};
/* en "Todos mezclados" el dorso es neutro: si mostrara el tema del mazo, daría una pista de qué tipo de canción es */
const deckTh=()=>MAZO===TODOS?"todos":MAZO;
const backOf=th=>`<div class="face backf" data-th="${esc(th)}"><span class="lb">${esc(TH_LABEL[th]||"Hitster")}</span><span class="q">?</span></div>`;
const cardUp=(id,cls="",style="")=>`<div class="card ${cls}" style="${style}">${front(id)}</div>`;
const cardDown=(cls="",attrs="")=>`<div class="card ${cls}" ${attrs}>${backOf(deckTh())}</div>`;
const cardFlip=(id,cls="",attrs="")=>`<div class="card flipwrap ${cls}" ${attrs}><div class="flipper">${backOf(deckTh())}${front(id)}</div></div>`;
/* carta de la línea: normal, o angosta con el año en vertical si no hay lugar (fit = {slim,w,h,fs}) */
function lineCard(id,fit,attrs="",cls="",style=""){
  if(fit&&fit.bar){const s=song(id);return `<div class="card bar ${cls.replace("tilt","")}" ${attrs} title="${esc(s.a)} — ${esc(s.t)} (${s.y})" style="--w:${fit.w}px;--h:${fit.h}px;--fs:${fit.fs}px;${style.replace(/--r:[^;]*;?/,"")}"><div class="barf" data-th="${esc(s.mz||"")}" style="--c:${dec(s.y)}"><span class="yr">${s.y}</span>${fit.h>=22?`<span class="ar">${esc(s.a)}</span>`:""}</div></div>`}
  if(!fit||!fit.slim)return `<div class="card ${cls}" ${attrs} style="${style}">${front(id)}</div>`;
  const s=song(id);
  return `<div class="card slim ${cls}" ${attrs} title="${esc(s.a)} — ${esc(s.t)} (${s.y})" style="--w:${fit.w}px;--h:${fit.h}px;--fs:${fit.fs}px;${style}"><div class="slimf" data-th="${esc(s.mz||"")}" style="--c:${dec(s.y)}"><span class="yr">${s.y}</span>${fit.h>=96?`<span class="ar">${esc(s.a)}</span>`:""}</div></div>`;
}
const tokensHTML=n=>`<span class="tokens" aria-label="${n} fichas">${Array.from({length:MAX_TOKENS},(_,i)=>`<i class="${i<n?"f":""}"></i>`).join("")}</span>`;
const chip=(p,cls="")=>`<span class="chip ${cls}" style="--pc:${p.color}" title="${esc(p.name)}">${esc((p.name[0]||"?").toUpperCase())}</span>`;

function currentLine(fit){
  const a=cur(),rev=state.phase==="reveal";
  const big=fit&&fit.slim?` style="--w:${fit.big}px"`:""; // la carta que se juega siempre a tamaño legible
  const tl=rev?state.snap:a.timeline,y=song(state.card).y;
  const choosing=state.pending!==null,chooser=choosing?P(state.pending):null;
  let h="";
  for(let i=0;i<=tl.length;i++){
    const ch=state.challenges.filter(c=>c.slot===i);
    const marks=ch.map(c=>{const p=P(c.pid);let cls=c.pid===ui.dropPid?"drop":"";if(rev)cls+=state.result.type==="challenger"&&state.result.pid===c.pid?" win":" lose";return chip(p,cls)}).join("");
    if(rev){
      if(i===state.placement&&state.result.type==="challenger"&&ui.stealDone)h+=`<div class="slot">${marks}</div>`;
      else if(i===state.placement)h+=`<div class="slot">${cardFlip(state.card,(ui.flipDone?"flipped noanim ":"")+(fits(tl,i,y)?"ring-ok":"ring-ko"),'data-anchor="reveal"'+big)}${marks}</div>`;
      else if(fits(tl,i,y)&&state.result.type!=="active")h+=`<div class="slot should">acá iba</div>${marks?`<div class="slot">${marks}</div>`:""}`;
      else if(marks)h+=`<div class="slot">${marks}</div>`;
    } else if(i===state.placement){
      h+=`<div class="slot">${cardDown("",'data-anchor="placed"'+big)}${marks}</div>`;
    } else if(ch.length){
      h+=`<div class="slot">${marks}</div>`;
    } else {
      const can=choosing||!state.challenges.length;
      const pc=choosing?chooser.color:a.color;
      h+=`<button class="slot ${choosing?"hot":""}" style="--pc:${pc}" data-act="place" data-slot="${i}" ${can?"":"disabled"} aria-label="${esc(choosing?chooser.name+" lo pone acá":"Poner el tema acá")}">+</button>`;
    }
    if(i<tl.length)h+=lineCard(tl[i],fit);
  }
  return h;
}

/* Cuánto mide cada carta en una línea. Si a tamaño normal quedarían de menos de 50 px, pasan a angostas. */
function fitLine(n,on,seat){
  if(seat.vert){ // línea vertical: cartas apaisadas, una abajo de la otra
    const placed=on&&state.placement!==null,big=Math.min(seat.T-20,60),slotsN=on?n+1:0;
    const avail=seat.L-70-(placed?Math.round(big*1.36)+3:0); // la etiqueta del jugador ocupa dos renglones en una línea angosta
    const h=Math.round(clamp((avail-slotsN*17-n*3)/Math.max(1,n),16,40));
    return{bar:true,slim:true,cw:big,big,w:Math.round(seat.T-16),h,fs:Math.round(Math.min(h*.62,18))};
  }
  const T=seat.T,maxW=(T-38)/1.36,slotsN=on?n+1:0,avail=seat.L-24;
  const k=Math.max(1,n+(on&&state.placement!==null?1:0));
  const cw=Math.min(maxW,(avail-slotsN*25-k*5)/k);
  if(cw>=50||cw>=maxW)return{slim:false,cw:Math.max(32,cw)};
  const big=Math.min(maxW,60),rest=avail-(on&&state.placement!==null?big+6:0);
  const w=Math.max(22,Math.min(maxW,(rest-slotsN*17-n*3)/Math.max(1,n))); // en modo angosto cada "+" ocupa 14 px más 3 de separación
  const h=Math.round(T-38);
  return{slim:true,cw:big,big,w:Math.round(w),h,fs:Math.round(Math.min(w*.72,(h-10)/2.5,20))};
}
function railHTML(p,seat){
  const on=p.id===cur().id&&state.phase!=="win";
  const tl=on&&state.phase==="reveal"?state.snap:p.timeline;
  const fit=fitLine(tl.length,on,seat),cw=fit.cw,T=seat.T;
  const stolen=state.phase==="reveal"&&state.result&&state.result.type==="challenger"&&state.result.pid===p.id?state.card:null;
  const inner=on?currentLine(fit):p.timeline.map(id=>id===stolen
    ?lineCard(id,fit,'data-anchor="stolen"',"tilt",`--r:${jitter(id)};${ui.stealDone?"":"visibility:hidden"}`)
    :lineCard(id,fit,"","tilt",`--r:${jitter(id)}`)).join("");
  return `<div class="rail ${on?"on":""} ${seat.vert?"vert":""}" data-pid="${p.id}" style="left:${seat.cx}px;top:${seat.cy}px;width:${seat.vert?T:seat.L}px;height:${seat.vert?seat.L:T}px;--rot:${seat.rot}deg;--pc:${p.color};--cw:${cw.toFixed(1)}px">
    <div class="row ${fit.slim?"tight":""}">${inner}</div>
    <div class="tag"><span class="dot"></span><b>${esc(p.name)}</b><span class="mono">${p.timeline.length}/${state.target}</span>${tokensHTML(p.tokens)}</div>
  </div>`;
}

function stageInner(cw){
  const a=cur();
  const pile=`<div class="pile">${cardDown()}${cardDown()}${state.deck.length?cardDown():""}<span class="pile-n"><span class="mono">${state.deck.length}</span> en el mazo</span></div>`;
  if(state.phase==="reveal"){
    const r=state.result,s=song(state.card),room=MAX_TOKENS-a.tokens,full=room<=0;
    const usado=(state.guess===true?1:0)+(state.guessMovie===true?1:0),sinLugar=v=>v!==true&&usado>=room; // no se puede pasar de 5
    let head,cls;
    if(r.type==="active"){head=`¡Bien! ${esc(a.name)} se la queda.`;cls="ok"}
    else if(r.type==="challenger"){head=`Le erró. ${esc(P(r.pid).name)} ganó el Hitster y se la lleva.`;cls="ko"}
    else{head=`Le erró${state.challenges.length?" y el Hitster tampoco pegó":""}. Carta afuera.`;cls="ko"}
    const nxt=state.players[(state.current+1)%state.players.length];
    return `<div class="note" style="--pc:${a.color}">
        <div class="result ${cls}">${head}</div>
        <div><b>${esc(s.t)}</b> · ${esc(s.a)} · <span class="mono">${s.y}</span></div>
        ${s.pe?`<div class="soft" style="font-size:14px">De la película <b style="color:var(--ink)">${esc(s.pe)}</b></div>`:""}
      </div>
      <div class="note"><span class="soft" style="font-size:13px">¿${esc(a.name)} dijo tema y artista antes de darla vuelta?${full?" (ya tiene 5 fichas)":""}</span>
        <div class="tools"><button class="btn small ${state.guess===true?"sel":""}" data-act="guess" data-v="1" ${sinLugar(state.guess)?"disabled":""}>Sí, +1 ficha</button><button class="btn small ${state.guess===false?"sel":""}" data-act="guess" data-v="0">No</button></div>
        ${s.pe?`<span class="soft" style="font-size:13px">¿Y dijo la película?</span><div class="tools"><button class="btn small ${state.guessMovie===true?"sel":""}" data-act="guessm" data-v="1" ${sinLugar(state.guessMovie)?"disabled":""}>Sí, +1 ficha</button><button class="btn small ${state.guessMovie===false?"sel":""}" data-act="guessm" data-v="0">No</button></div>`:""}
      </div>
      <button class="btn dark" data-act="next">Siguiente: turno de ${esc(nxt.name)}</button>`;
  }
  const placed=state.placement!==null,choosing=state.pending!==null;
  const eligible=state.players.filter(p=>p.id!==a.id&&p.tokens>0&&!state.challenges.some(c=>c.pid===p.id));
  let msg;
  if(choosing){const c=P(state.pending);msg=`<b style="color:${c.color}">${esc(c.name)}</b> cantó Hitster: que toque dónde lo pondría.`}
  else if(!placed)msg=`Escuchen el tema y ubíquenlo en la línea.`;
  else msg=state.challenges.length?`¿Alguien más canta Hitster? Si no, denla vuelta.`:`¿Todos de acuerdo? Si no, ¡Hitster!`;
  return `<div class="pair">${pile}${placed?`<div class="card" style="--w:${cw*1.15}px;visibility:hidden"></div>`:cardDown("wobble",`data-anchor="mystery" style="--w:${cw*1.15}px"`)}</div>
    <div class="note" style="--pc:${a.color}">
      <div id="audio" style="display:grid;gap:6px;justify-items:center">${audioHTML()}</div>
      <h2>Turno de <span>${esc(a.name)}</span></h2>
      <p>${msg}</p>
      ${choosing?`<div><button class="btn small" data-act="cancelpend">Cancelar Hitster</button></div>`:""}
    </div>
    <div class="hud">
      ${!placed?`<button class="btn small" data-act="skip" ${a.tokens<1?"disabled":""}>Saltear <span class="cost">−1</span></button>`:""}
      <button class="hitster" data-act="hitster" ${!placed||choosing||!eligible.length?"disabled":""} aria-label="Cantar Hitster">Hitster</button>
      ${!placed?`<button class="btn small" data-act="buy" ${a.tokens<3?"disabled":""}>Canjear <span class="cost">−3</span></button>`:`<button class="btn dark small" data-act="reveal" ${choosing?"disabled":""}>Darla vuelta</button>`}
    </div>`;
}

/* ---------- vistas ---------- */
function spotifyPanel(){
  const s=Spotify.status;
  let body;
  if(s.state==="connected")body=`<p class="soft" style="margin:0">Conectado como <b style="color:var(--ink)">${esc(s.name)}</b>.</p><div class="btnrow"><button class="btn small" data-act="spdisconnect">Desconectar Spotify</button></div>`;
  else if(s.state==="working")body=`<p class="soft" style="margin:0">Conectando con Spotify…</p>`;
  else body=`${s.error?`<p class="hint">${esc(s.error)}</p>`:`<p class="soft" style="margin:0">Hace falta una sola vez en esta tablet: después entra solo.</p>`}<div class="btnrow"><button class="btn dark" data-act="spconnect">Conectar Spotify</button>${s.state==="error"?`<button class="btn small" data-act="spdisconnect">Borrar sesión guardada</button>`:""}</div>`;
  return `<div class="panel"><h3>Spotify</h3>${body}</div>`;
}

const DEVTYPE={Smartphone:"Celular",Tablet:"Tablet",Computer:"Computadora",Speaker:"Parlante",TV:"Tele",CastAudio:"Parlante",CastVideo:"Tele",AVR:"Equipo de audio",Automobile:"Auto"};
function viewDevices(){
  const d=ui.dev,last=Spotify.lastDevice();
  let body;
  if(!Spotify.connected())body=`<p class="hint">Primero hay que conectar Spotify.</p><div class="btnrow"><button class="btn dark" data-act="spconnect">Conectar Spotify</button></div>`;
  else if(d.loading)body=`<p class="soft" style="margin:0">Buscando dispositivos…</p>`;
  else if(d.error)body=`<p class="hint">${esc(d.error)}</p>`;
  else if(!d.list.length)body=`<p class="hint">No aparece ningún dispositivo. Abrí la app de Spotify en la tablet (si sigue sin aparecer, poné cualquier tema un segundo y pausalo) y tocá Actualizar.</p>`;
  else body=`<div class="plist">${d.list.map(v=>`<button class="btn" style="justify-content:space-between;border-radius:14px;text-align:left;flex-wrap:wrap" data-act="device" data-id="${esc(v.id)}" ${v.is_restricted||!v.id?"disabled":""}><b>${esc(v.name)}</b><span class="soft" style="font-size:13px">${esc(DEVTYPE[v.type]||v.type)}${last&&last.id===v.id?" · el último que usaron":""}${v.is_restricted?" · no se puede controlar":""}</span></button>`).join("")}</div>`;
  return `<div class="page"><div class="panel">
    <h3>¿Dónde suena la música?</h3>
    <p class="hint">Elegí la tablet que queda en el medio de la mesa (la que tiene el parlante bluetooth conectado). La app de Spotify tiene que estar abierta en ella.</p>
    ${body}
    <div class="btnrow">${Spotify.connected()?`<button class="btn small" data-act="devrefresh">Actualizar</button>`:""}<button class="btn small" data-act="devback">Volver</button></div>
  </div></div>`;
}

let geo=null,stageAngle=0;
const VISTA_KEY="hitster-vista";
function vista(){try{return localStorage.getItem(VISTA_KEY)==="pantalla"?"pantalla":"mesa"}catch(e){return "mesa"}}
function setVista(v){try{localStorage.setItem(VISTA_KEY,v)}catch(e){}ui.angle=null}
const ORIENT_KEY="hitster-orient";
function orient(){try{return localStorage.getItem(ORIENT_KEY)==="abajo"?"abajo":"jugador"}catch(e){return "jugador"}}
function setOrient(v){try{localStorage.setItem(ORIENT_KEY,v)}catch(e){}ui.angle=null}
function viewGame(){
  geo=layout();
  const {seats,stage:g}=geo;
  const target=g.rot;
  if(ui.angle===null)ui.angle=target;
  const d=((target-ui.angle)%360+540)%360-180;
  stageAngle=ui.angle+d;
  const cw=Math.max(40,Math.min(84,(g.wide?g.h/1.9:g.h/4.4)));
  return `<button class="quit" data-act="quit">Salir</button>
    <button class="quit vista" data-act="vista" title="Cambiar entre vista de mesa (tablet) y de pantalla (compu)">${vista()==="pantalla"?"Vista mesa":"Vista pantalla"}</button>
    ${state.players.map((p,i)=>railHTML(p,seats[i])).join("")}
    <div class="stage ${g.wide?"wide":""}" id="stage" style="left:${g.cx}px;top:${g.cy}px;width:${g.w}px;height:${g.h}px;--rot:${ui.angle}deg;--cw:${cw}px">${stageInner(cw)}</div>
    ${modalHTML(target)}`;
}

function modalHTML(rot){
  if(ui.modal!=="hitster")return "";
  const a=cur();
  const el=state.players.filter(p=>p.id!==a.id&&p.tokens>0&&!state.challenges.some(c=>c.pid===p.id));
  return `<div class="modal" data-act="closemodal"><div class="sheet" style="--rot:${rot}deg" role="dialog" aria-modal="true" aria-label="¿Quién cantó Hitster?">
    <h3>¡Hitster!</h3><p class="soft" style="margin:0">¿Quién lo gritó primero? Gasta 1 ficha.</p>
    <div class="who">${el.map(p=>`<button class="btn" style="--pc:${p.color}" data-act="pick" data-pid="${p.id}"><b>${esc(p.name)}</b>${tokensHTML(p.tokens)}</button>`).join("")}</div>
    <div><button class="btn small" data-act="closemodal">Cancelar</button></div>
  </div></div>`;
}

function viewWin(){
  const w=state.winner!==null?P(state.winner):null;
  const ranked=state.players.slice().sort((x,y)=>y.timeline.length-x.timeline.length);
  const top=w||ranked[0];
  return `<div class="page winpage" style="--pc:${top.color}"><div class="panel">
    <h1>${w?`¡Ganó <span>${esc(w.name)}</span>!`:"Se terminó el mazo"}</h1>
    ${w?"":`<p class="soft">Va primero <b style="color:${top.color}">${esc(top.name)}</b> con ${top.timeline.length} cartas.</p>`}
    <div class="standings">${ranked.map(p=>`<span class="stand" style="--pc:${p.color}"><b>${esc(p.name)}</b><span class="mono">${p.timeline.length}</span></span>`).join("")}</div>
    <div class="wline">${top.timeline.map(id=>cardUp(id)).join("")}</div>
    <div class="btnrow" style="justify-content:center"><button class="btn dark" data-act="again">Jugar de nuevo</button><button class="btn" data-act="quit">Cambiar jugadores</button></div>
  </div></div>`;
}

/* ---------- render + animaciones ---------- */
function render(){
  const inGame=state&&state.phase!=="win";
  $app.style.overflowY=inGame?"hidden":"auto";
  // para animar el cambio de turno: dónde estaba cada línea antes de redibujar
  const turno=inGame&&ui.lastCurrent!=null&&ui.lastCurrent!==state.current&&!reduce,antes={};
  if(turno)document.querySelectorAll(".rail[data-pid]").forEach(r=>antes[r.dataset.pid]=r.getBoundingClientRect());
  $app.innerHTML=!state?(ui.screen==="devices"?viewDevices():viewSetup()):state.phase==="win"?viewWin():viewGame();
  ui.lastCurrent=inGame?state.current:null;
  if(turno){
    document.querySelectorAll(".rail[data-pid]").forEach(r=>{
      const a=antes[r.dataset.pid];if(!a)return;const b=r.getBoundingClientRect();
      const dx=(a.left+a.width/2)-(b.left+b.width/2),dy=(a.top+a.height/2)-(b.top+b.height/2);
      if(Math.abs(dx)<2&&Math.abs(dy)<2)return; // en la mesa las líneas no se mueven
      const sc=Math.max(.3,Math.min(3,a.width/Math.max(1,b.width)));
      r.animate([{translate:`${dx}px ${dy}px`,scale:sc,opacity:.85},{translate:"0 0",scale:1,opacity:1}],{duration:650,easing:"cubic-bezier(.35,.1,.2,1)"});
    });
    const tag=document.querySelector(".rail.on .tag");if(tag)tag.classList.add("turn-in");
  }
  save();
  if(!inGame)return;
  // la carta del centro gira hacia el jugador de turno
  const st=document.getElementById("stage");
  if(st&&stageAngle!==ui.angle){st.getBoundingClientRect();st.style.setProperty("--rot",stageAngle+"deg")}
  ui.angle=stageAngle;
  // si la línea del que juega no entra entera, se corre para que se vea la carta que se está jugando
  const anc=document.querySelector('[data-anchor="placed"],[data-anchor="reveal"]');
  if(anc){const row=anc.closest(".row");if(row&&row.scrollWidth>row.clientWidth)row.scrollLeft=anc.parentElement.offsetLeft-row.clientWidth/2+anc.offsetWidth/2;if(row&&row.scrollHeight>row.clientHeight)row.scrollTop=anc.parentElement.offsetTop-row.clientHeight/2+anc.offsetHeight/2}
  // la carta vuela desde el centro al hueco elegido
  if(ui.flyFrom){
    const el=document.querySelector('[data-anchor="placed"]');
    if(el&&!reduce){
      const to=el.getBoundingClientRect(),f=ui.flyFrom;
      const dx=f.left+f.width/2-(to.left+to.width/2),dy=f.top+f.height/2-(to.top+to.height/2);
      const t=geo.seats[state.current].rot*Math.PI/180,c=Math.cos(t),s=Math.sin(t);
      const lx=dx*c+dy*s,ly=-dx*s+dy*c;
      const sc=Math.max(f.width,f.height)/Math.max(to.width,to.height);
      el.animate([{transform:`translate(${lx}px,${ly}px) scale(${sc}) rotate(-10deg)`},{transform:"none"}],{duration:560,easing:"cubic-bezier(.25,.8,.3,1)"});
    }
    ui.flyFrom=null;
  }
  ui.dropPid=null;
  // la carta se da vuelta
  if(state.phase==="reveal"&&!ui.flipDone){
    const el=document.querySelector('[data-anchor="reveal"]');
    if(el){el.getBoundingClientRect();requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("flipped")))}
    ui.flipDone=true;
    // si alguien la robó: cuando termina de darse vuelta, vuela hasta la línea del que cantó Hitster
    if(!ui.stealDone){clearTimeout(ui.stealT);ui.stealT=setTimeout(steal,reduce?0:1050)}
  } else if(state.phase==="reveal"&&!ui.stealDone&&!ui.stealT){ui.stealDone=true;render()}
}
function steal(){
  ui.stealT=null;
  if(!state||state.phase!=="reveal"||ui.stealDone)return;
  ui.stealDone=true;
  const src=document.querySelector('[data-anchor="reveal"]'),dst=document.querySelector('[data-anchor="stolen"]');
  if(reduce||!src||!dst){render();return}
  const row=dst.closest(".row");if(row){row.scrollLeft=dst.offsetLeft-row.clientWidth/2+dst.offsetWidth/2;row.scrollTop=dst.offsetTop-row.clientHeight/2+dst.offsetHeight/2} // solo esa fila, no la mesa
  const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();
  const r0=geo.seats[state.current].rot,r1=geo.seats[state.result.pid].rot+parseFloat(jitter(state.card));
  const turn=((r1-r0)%360+540)%360-180; // gira por el lado más corto
  const w0=src.offsetWidth,w1=dst.offsetWidth;
  const fly=document.createElement("div");
  fly.className="card";fly.innerHTML=front(state.card);
  Object.assign(fly.style,{position:"fixed",left:(a.left+a.width/2)+"px",top:(a.top+a.height/2)+"px",margin:"0",zIndex:"15",pointerEvents:"none",boxShadow:"0 0 0 3px var(--good),0 14px 30px var(--shadow)"});
  fly.style.setProperty("--w",w0+"px");
  document.body.appendChild(fly);
  src.style.visibility="hidden";
  const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);
  fly.animate([
    {transform:`translate(-50%,-50%) rotate(${r0}deg) scale(1)`},
    {transform:`translate(calc(-50% + ${dx*.5}px),calc(-50% + ${dy*.5}px)) rotate(${r0+turn*.5}deg) scale(${Math.max(1.25,w1/w0*1.25)})`,offset:.45},
    {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${r0+turn}deg) scale(${w1/w0})`}
  ],{duration:1000,easing:"cubic-bezier(.45,.05,.3,1)"}).onfinish=()=>{
    src.style.display="none"; // queda igual que el próximo render: en esa línea solo las fichas
    dst.style.visibility="";dst.classList.add("drop");fly.remove();
  };
}

/* ---------- eventos ---------- */
document.addEventListener("input",e=>{const i=e.target.dataset.name;if(i!==undefined)setup.names[+i]=e.target.value});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const act=b.dataset.act;
  if(act==="closemodal"&&b.classList.contains("modal")&&e.target!==b)return;
  switch(act){
    case "add":setup.names.push(`Jugador ${setup.names.length+1}`);render();break;
    case "rm":setup.names.splice(+b.dataset.i,1);render();break;
    case "tgt":setup.target=Math.min(20,Math.max(3,setup.target+ +b.dataset.d));render();break;
    case "tok":setup.tokens=Math.min(MAX_TOKENS,Math.max(0,setup.tokens+ +b.dataset.d));render();break;
    case "start":if(setup.names.filter(n=>n.trim()).length<2){toast("Hacen falta al menos 2 jugadores");break}ui.screen="devices";loadDevices();break;
    case "smode":setup.start=b.dataset.v;render();break;
    case "mazo":useMazo(b.dataset.v);try{localStorage.setItem(MAZO_KEY,MAZO)}catch(e){}render();break;
    case "devrefresh":loadDevices();break;
    case "devback":ui.screen=null;render();break;
    case "device":{const v=ui.dev.list.find(x=>x.id===b.dataset.id);if(!v)break;setup.device={id:v.id,name:v.name};Spotify.rememberDevice(v);ui.screen=null;newGame();break}
    case "replay":playCurrent();break;
    case "vista":setVista(vista()==="pantalla"?"mesa":"pantalla");ui.flipDone=true;if(!ui.stealT)ui.stealDone=true;render();break;
    case "vistaset":setVista(b.dataset.v);render();break;
    case "orient":setOrient(b.dataset.v);render();break;
    case "spconnect":Spotify.login();break;
    case "spdisconnect":Spotify.logout();break;
    case "resume":state=loadSaved();if(!state){render();break}useMazo(state.mazo||"rock-nacional");ui.flipDone=true;ui.stealDone=true;ui.angle=null;keepAwake();render();playCurrent();break;
    case "discard":state=null;save();render();break;
    case "place":place(+b.dataset.slot);break;
    case "hitster":ui.modal="hitster";render();break;
    case "pick":ui.modal=null;state.pending=+b.dataset.pid;render();break;
    case "closemodal":ui.modal=null;render();break;
    case "cancelpend":state.pending=null;render();break;
    case "reveal":reveal();break;
    case "guess":state.guess=b.dataset.v==="1";render();break;
    case "guessm":state.guessMovie=b.dataset.v==="1";render();break;
    case "next":nextTurn();break;
    case "skip":skip();break;
    case "buy":buy();break;
    case "again":setup.names=state.players.map(p=>p.name);setup.device=state.device||setup.device;setup.start=state.startMode||setup.start;state=null;newGame();break;
    case "quit":if(state){setup.names=state.players.map(p=>p.name);if(state.phase!=="win")stopMusic()}state=null;ui.modal=null;save();render();break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.modal){ui.modal=null;render()}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(state&&state.phase!=="win"){ui.flipDone=true;if(!ui.stealT)ui.stealDone=true;render()}},150)});

async function start(data){await loadSongs();if(data&&data.state){state=data.state;useMazo(state.mazo||"rock-nacional");ui.flipDone=true}render();Spotify.init(()=>{if(!state)render()})}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
